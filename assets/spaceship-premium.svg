    <path d="M307 292c57 10 114 10 171-1" fill="none" stroke="#ffffff" stroke-width="3" opacity=".38"/>

    <g filter="url(#softGlow)">
      <path d="M170 421c-38 10-78 26-120 48 52 7 108 7 168-1 28-4 51-17 69-39-37-11-76-14-117-8Z" fill="#eb4604"/>
      <path d="M186 438c-30 4-62 13-96 27 39 2 79 0 120-5 19-3 35-11 48-25-23-3-47-2-72 3Z" fill="#ffb168" opacity=".92"/>
    </g>

    <g opacity=".95">
