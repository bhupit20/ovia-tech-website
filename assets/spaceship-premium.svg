<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-labelledby="title desc">
  <title id="title">Premium futuristic Ovia Tech spaceship</title>
  <desc id="desc">A sleek orange and blue sci-fi spaceship with glowing engine trails and holographic highlights.</desc>
  <defs>
    <radialGradient id="aura" cx="50%" cy="48%" r="52%">
      <stop offset="0" stop-color="#ff8a2a" stop-opacity=".38"/>
      <stop offset=".42" stop-color="#8c6dff" stop-opacity=".2"/>
      <stop offset="1" stop-color="#060914" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hull" x1="178" x2="722" y1="284" y2="284" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#111a34"/>
      <stop offset=".18" stop-color="#f3f7ff"/>
      <stop offset=".5" stop-color="#ffffff"/>
      <stop offset=".82" stop-color="#c9d8ff"/>
      <stop offset="1" stop-color="#17223f"/>
    </linearGradient>
    <linearGradient id="orange" x1="232" x2="664" y1="330" y2="172" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b63202"/>
      <stop offset=".48" stop-color="#eb4604"/>
      <stop offset="1" stop-color="#ffb168"/>
    </linearGradient>
    <linearGradient id="glass" x1="370" x2="555" y1="174" y2="250" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#dff9ff"/>
      <stop offset=".38" stop-color="#70d8ff"/>
      <stop offset="1" stop-color="#3b3cff"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="190" x2="708" y1="414" y2="414" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#29d4ff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#7dd3fc" stop-opacity=".92"/>
      <stop offset="1" stop-color="#8c6dff" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feColorMatrix in="blur" values="1 0 0 0 0.93 0 1 0 0 0.28 0 0 1 0 0.02 0 0 0 .85 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="blueBloom" x="-40%" y="-60%" width="180%" height="220%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feColorMatrix in="blur" values="0 0 0 0 .15 0 0 0 0 .75 0 0 0 0 1 0 0 0 .8 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="28" stdDeviation="22" flood-color="#020617" flood-opacity=".52"/>
      <feDropShadow dx="0" dy="0" stdDeviation="18" flood-color="#eb4604" flood-opacity=".28"/>
    </filter>
  </defs>

  <rect width="900" height="620" fill="none"/>
  <ellipse cx="450" cy="310" rx="372" ry="244" fill="url(#aura)"/>

