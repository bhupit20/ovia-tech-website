    <path d="M222 344 92 392c-24 9-38 26-42 51 74-26 148-41 222-44 20-17 37-35 50-54Z" fill="#101a31"/>
    <path d="M678 310 814 262c25-9 44-4 56 16-50 46-115 79-195 99-14-17-19-39 3-67Z" fill="#141e38"/>
    <path d="M200 356c95 31 194 44 298 38 98-5 190-28 277-68-20 35-57 65-110 90-146 69-302 73-465 12-34-13-49-37-45-72 15-4 30-4 45 0Z" fill="#0d162c" opacity=".95"/>

    <path d="M254 389c83 25 164 36 244 31 77-4 148-22 214-53" fill="none" stroke="#7dd3fc" stroke-width="4" opacity=".45"/>
